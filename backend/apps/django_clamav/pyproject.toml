[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-clamav"
version = "1.0.0"
description = "A reusable ClamAV integration for Django and Python projects. Supports clamd daemon (TCP/Unix socket) and clamscan binary backends."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kapybar Team"},
]
keywords = [
    "django",
    "clamav",
    "antivirus",
    "virus",
    "scanning",
    "security",
    "file-upload",
    "malware",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

# Core dependencies: NONE for the scanner/clamd client (pure Python)
# Django is optional for the forms/middleware/validators
dependencies = []

[project.optional-dependencies]
django = ["Django>=4.2"]
drf = ["Django>=4.2", "djangorestframework>=3.14"]
microservice = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "python-multipart>=0.0.6"]
dev = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://github.com/kapybar/django-clamav"
Documentation = "https://github.com/kapybar/django-clamav#readme"
Repository = "https://github.com/kapybar/django-clamav"
Issues = "https://github.com/kapybar/django-clamav/issues"

[tool.setuptools.packages.find]
include = ["django_clamav*"]

[tool.setuptools.package-data]
django_clamav = ["bin/*", "microservice/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py"]
